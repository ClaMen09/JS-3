<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>

<body class="text-center">
    <h1>CONVERTITORE DI VALUTA</h1>
    
    <button id="cambiaColore" class="toggle-btn">
        <i id="toggleIcon" class="bi bi-toggle2-off"></i>
    </button>

    <h2>Euro</h2>
    <img src="./images/Flag_of_Europe.svg" alt="Europa" class="bandiera"><br>
    <input id="Valuta" type="number" oninput="cambio()">

    <div class="container text-center">
        <div class="row m-5">
            <div class="col-md-4 my-3">
            <h3>Dollaro americano</h3>
            <img src="./images/Flag_of_the_United_States.svg.webp" alt="USA" class="bandiera">
            <p><span id="USA"></span> $</p>
            </div>
            <div class="col-md-4 my-3">
            <h3>Sterlina</h3>
            <img src="./images/Flag_of_the_United_Kingdom_(1-2).svg.webp" alt="UK" class="bandiera">
            <p><span id="UK"></span> £</p>
            </div>
            <div class="col-md-4 my-3">
            <h3>Yen</h3>
            <img src="./images/Flag_of_Japan.svg" alt="Giappone" class="bandiera">
            <p><span id="Japan"></span> ¥</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
